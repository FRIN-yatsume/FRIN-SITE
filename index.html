<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIN - Fuji Research Institute of Neuroscience</title>
  <style>

    /* ===== Palatino Linotype 字体本地加载 ===== */
    @font-face {
      font-family: 'PalatinoLinotype';
      src: url('asset/palai.ttf') format('truetype');
      font-style: italic;
      font-weight: normal;
    }

    /* ===== 全局重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== body：渐变背景，锁死视口，禁止滚动 ===== */
    body {
      background: linear-gradient(to bottom, #585858, #c64aef);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===================================================
       顶部 header：分两层
       - #header-bar    ：纯黑深色条背景，BAR_KEYFRAMES 控制
       - #header-content：logo + 导航文字，TITLE_KEYFRAMES 控制
    =================================================== */
    #header-bar {
      position: relative;
      width: 100%;
      height: 10vh;
      background: #000000;
      flex-shrink: 0;
      opacity: 0;
      z-index: 100;
    }

    /* 内容层：绝对定位在黑条上方，独立控制透明度 */
    #header-content {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      padding: 0 2.5vw;
      opacity: 0;
      pointer-events: none;
    }

    /* 文字可点击时开启 pointer-events */
    #header-content.interactive {
      pointer-events: all;
    }

    /* FRIN Logo */
    .frin-logo {
      height: 70%;
      width: auto;
      margin-right: 3vw;
    }

    /* 导航链接 */
    nav { display: flex; gap: 4.5vw; }

    nav a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px);
      color: #5a585b;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    nav a:hover  { color: #c8c8c8; }
    nav a.active { color: #ff31eb; }

    /* ===== 场景容器：剩余高度，居中放置内容 ===== */
    .scene-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      overflow: hidden;
    }

    /* ===== 主场景：全屏 ===== */
    .scene {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      z-index: 0;
    }

    /* 视频铺满场景 */
    .scene video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== 大标题覆盖层 ===== */
    .title-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 48%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 3%;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .title-line {
      font-family: 'Verdana', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: clamp(16px, 5.8vw, 112px);
      color: #ffffff;
      line-height: 1.18;
      display: block;
    }

    .title-line .initial { color: #ff31eb; }

    .title-of {
      font-family: 'PalatinoLinotype', 'Palatino Linotype', Palatino, serif;
      font-weight: normal;
      font-style: italic;
      font-size: clamp(13px, 4.5vw, 86px);
      color: #ffffff;
      line-height: 1.18;
      display: block;
    }

    /* ===== 热区层（视频结束后激活） ===== */
    .hotspot-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 20;
    }

    .hotspot-layer.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===================================================
       SVG 热区（内联方式）：铺满场景，透明不可见
       - 用内联 <svg> 替代 <object>，彻底解决跨域问题
       - pointer-events: all 确保透明区域也能接收事件
    =================================================== */
    .hotspot-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
      pointer-events: none; /* 默认关闭，shape 上单独开启 */
    }

    /* 每个热区 path / polyline 的交互样式 */
    .hotspot-svg .hotspot-shape {
      fill: transparent;
      stroke: none;
      pointer-events: all; /* 透明区域也可点击 */
      cursor: pointer;
    }

    /* ===== highlight SVG 覆盖：hover 时淡入 ===== */
    .hotspot-highlight {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 25;
    }

    .hotspot-highlight.visible { opacity: 1; }

    /* ===== 光点辉光 ===== */
    .glow-point {
      position: absolute;
      width: 2.5%;
      padding-bottom: 2.5%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      transition: opacity 0.25s ease;
      z-index: 30;
    }

    .glow-point.visible {
      opacity: 1;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 0.85; }
      50%       { transform: translate(-50%, -50%) scale(1.8); opacity: 1;    }
    }

    /* ===== Tooltip ===== */
    .tooltip {
      position: absolute;
      background: rgba(14, 0, 22, 0.9);
      border: 1px solid rgba(198, 74, 239, 0.55);
      padding: 1% 1.4%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
      transform: translate(-50%, -120%);
      white-space: nowrap;
    }

    .tooltip.visible { opacity: 1; }

    .tooltip .region-name {
      font-family: 'Times New Roman', serif;
      font-size: clamp(7px, 0.65vw, 12px);
      color: #5a585b;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      display: block;
      margin-bottom: 0.3em;
    }

    .tooltip .region-function {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(11px, 1.05vw, 19px);
      color: #ff31eb;
      display: block;
      margin-bottom: 0.5em;
    }

    .tooltip .region-link {
      font-family: 'Times New Roman', serif;
      font-size: clamp(9px, 0.8vw, 14px);
      color: #ffffff;
      text-decoration: none;
      pointer-events: all;
      transition: color 0.25s;
    }

    .tooltip .region-link:hover { color: #edc969; }

    /* ===== 底部条块：纯黑，全宽 ===== */
    #footer {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      background: #000000;
      padding: 0 3vw;
      height: 10vh;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-shrink: 0;
      opacity: 0;
      z-index: 100;
    }

    #footer a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px);
      color: #ff31eb;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    #footer a:hover { color: #ffffff; }

  </style>
</head>
<body>

  <!-- ===== 顶部黑条 ===== -->
  <div id="header-bar">
    <div id="header-content">
      <img class="frin-logo" src="asset/frinLogo.png" alt="FRIN Logo">
      <nav>
        <a href="index.html" class="active">homepage</a>
        <a href="recruit.html">recruit</a>
        <a href="now.html">now</a>
        <a href="contact.html">contact us</a>
      </nav>
    </div>
  </div>

  <!-- ===== 场景容器 ===== -->
  <div class="scene-container" id="scene-container">
    <div class="scene" id="scene">

      <!-- 进场动画视频 -->
      <video id="intro-video" muted playsinline preload="auto">
        <source src="asset/MainLoadingBottom.mp4" type="video/mp4">
      </video>

      <!-- 大标题覆盖层 -->
      <div class="title-overlay" id="title-overlay">
        <span class="title-line"><span class="initial">F</span>uji</span>
        <span class="title-line"><span class="initial">R</span>esearch</span>
        <span class="title-line"><span class="initial">I</span>nstitute</span>
        <span class="title-of">of</span>
        <span class="title-line"><span class="initial">N</span>euroscience</span>
      </div>

      <!-- =====================================================
           热区层（视频结束后激活）
           核心变更：用内联 <svg> 替代 <object> 标签
           原因：<object> 加载外部 SVG 在 file:// 协议下跨域被拦截，
                 contentDocument 无法读取内部 DOM，事件绑定失败。
                 内联 SVG 直接在页面 DOM 中，无跨域问题，事件可直接绑定。
      ====================================================== -->
      <div class="hotspot-layer" id="hotspot-layer">

        <!-- ── Reward 热区 ──
             内联 SVG：viewBox 与 Illustrator 导出一致（1920×1080）
             path 使用 fill="transparent" 不可见，但完整保留点击区域
        -->
        <svg class="hotspot-svg"
             id="obj-reward"
             viewBox="0 0 1920 1080"
             xmlns="http://www.w3.org/2000/svg"
             data-glow="glow-reward"
             data-tooltip="tooltip-reward"
             data-highlight="hl-reward"
             data-target="reward.html">
          <path class="hotspot-shape"
                d="M894.28,625.94c10.72,0,110.3,35.23,110.3,35.23l38.3,7.66,6.13-42.89,1.53-70.47-156.26,7.66s-13.79,50.55-9.19,49.02,9.19,13.79,9.19,13.79Z"/>
        </svg>

        <!-- Reward：胶囊高亮标签（hover 时淡入） -->
        <img class="hotspot-highlight" id="hl-reward"
             src="asset/highlight-reward.svg" alt="">

        <!-- Reward：光点辉光 -->
        <div class="glow-point" id="glow-reward"
             style="left:53.5%; top:60%;
                    background:radial-gradient(circle,#edc969 0%,rgba(237,201,105,0.2) 60%,transparent 100%);
                    box-shadow:0 0 16px 8px rgba(237,201,105,0.5);">
        </div>

        <!-- Reward：Tooltip -->
        <div class="tooltip" id="tooltip-reward" style="left:53.5%; top:57%;">
          <span class="region-name">Nucleus Accumbens</span>
          <span class="region-function">Reward</span>
          <a class="region-link" href="reward.html">Awards &amp; Recognition →</a>
        </div>


        <!-- ── Vision 热区 ──
             两段 path 共同构成 Visual Cortex 区域
        -->
        <svg class="hotspot-svg"
             id="obj-vision"
             viewBox="0 0 1920 1080"
             xmlns="http://www.w3.org/2000/svg"
             data-glow="glow-vision"
             data-tooltip="tooltip-vision"
             data-highlight="hl-vision"
             data-target="vision.html">
          <path class="hotspot-shape"
                d="M1211.38,613.37c2.31,27.48,83.22,125.62,83.22,125.62l43.92-62.81-110.97-62.81"/>
          <path class="hotspot-shape"
                d="M1443.98,214.52l-125.31,31.8,228.2,154.42s87.32,194.24,44.43,275.43c-5.45,10.32-157.79,135.12-157.79,135.12l137.87,27.57,78.13-52.09,100.45-98.16-7.92-167.4-41.36-101.11-80.28-103.64-70.47-62.81-105.95-39.16Z"/>
        </svg>

        <!-- Vision：胶囊高亮标签 -->
        <img class="hotspot-highlight" id="hl-vision"
             src="asset/highlight-vision.svg" alt="">

        <!-- Vision：光点辉光 -->
        <div class="glow-point" id="glow-vision"
             style="left:77.5%; top:29%;
                    background:radial-gradient(circle,#edc969 0%,rgba(237,201,105,0.2) 60%,transparent 100%);
                    box-shadow:0 0 16px 8px rgba(237,201,105,0.5);">
        </div>

        <!-- Vision：Tooltip -->
        <div class="tooltip" id="tooltip-vision" style="left:77.5%; top:26%;">
          <span class="region-name">Visual Cortex</span>
          <span class="region-function">Vision</span>
          <a class="region-link" href="vision.html">Visual Research →</a>
        </div>


        <!-- ── Secret 热区 ──
             无 tooltip、无 highlight，仅红色光点，设计意图为隐藏彩蛋
        -->
        <svg class="hotspot-svg"
             id="obj-secret"
             viewBox="0 0 1920 1080"
             xmlns="http://www.w3.org/2000/svg"
             data-glow="glow-secret"
             data-target="secret.html">
          <polyline class="hotspot-shape"
                    points="1153.17 431.38 1050.53 422.19 1024.49 475.81 1073.51 520.23 1108.74 520.23 1153.17 439.04"/>
        </svg>

        <!-- Secret：光点辉光（红色） -->
        <div class="glow-point" id="glow-secret"
             style="left:65.5%; top:46.5%;
                    background:radial-gradient(circle,#b2002a 0%,rgba(178,0,42,0.2) 60%,transparent 100%);
                    box-shadow:0 0 16px 8px rgba(178,0,42,0.45);">
        </div>

      </div><!-- /hotspot-layer -->
    </div><!-- /scene -->
  </div><!-- /scene-container -->

  <!-- ===== 底部纯黑条 ===== -->
  <footer id="footer">
    <a href="questionnaire.html">questionnaire→</a>
  </footer>


  <script>

    // ===== 关键帧：顶部黑条 + 底部黑条同步进场 =====
    const BAR_KEYFRAMES = [
      { time: 0.875, opacity: 0.10 },
      { time: 1.000, opacity: 0.20 },
      { time: 1.125, opacity: 0.40 },
      { time: 1.250, opacity: 0.80 },
      { time: 1.375, opacity: 1.00 },
    ];

    // ===== 关键帧：标题文字 + 导航文字 + logo 同步进场 =====
    const TITLE_KEYFRAMES = [
      { time: 1.625, opacity: 0.00 },
      { time: 1.750, opacity: 0.10 },
      { time: 1.875, opacity: 0.60 },
      { time: 2.000, opacity: 0.80 },
      { time: 2.125, opacity: 1.00 },
    ];

    // ===== smooth-step 补间函数 =====
    function smoothstep(a, b, t) {
      t = Math.max(0, Math.min(1, t));
      t = t * t * (3 - 2 * t);
      return a + (b - a) * t;
    }

    // ===== 根据当前播放时间插值 opacity =====
    function getOpacity(keyframes, currentTime) {
      if (currentTime <= keyframes[0].time) return keyframes[0].opacity;
      if (currentTime >= keyframes[keyframes.length - 1].time) return 1;
      for (let i = 0; i < keyframes.length - 1; i++) {
        const a = keyframes[i], b = keyframes[i + 1];
        if (currentTime >= a.time && currentTime <= b.time) {
          const t = (currentTime - a.time) / (b.time - a.time);
          return smoothstep(a.opacity, b.opacity, t);
        }
      }
      return 0;
    }

    // ===== DOM 元素引用 =====
    const video          = document.getElementById('intro-video');
    const headerBar      = document.getElementById('header-bar');
    const headerContent  = document.getElementById('header-content');
    const titleOverlay   = document.getElementById('title-overlay');
    const footer         = document.getElementById('footer');
    const hotspotLayer   = document.getElementById('hotspot-layer');
    const scene          = document.getElementById('scene');

    // ===== scene 尺寸：全视口 =====
    function resizeScene() {
      scene.style.width  = window.innerWidth + 'px';
      scene.style.height = window.innerHeight + 'px';
    }
    resizeScene();
    window.addEventListener('resize', resizeScene);

    // ===== 所有元素设为最终显示态 =====
    function showFinalState() {
      headerBar.style.opacity     = 1;
      headerContent.style.opacity = 1;
      headerContent.classList.add('interactive');
      titleOverlay.style.opacity  = 1;
      footer.style.opacity        = 1;
    }

    // =====================================================
    // 初始化内联 SVG 热区
    // 与原来的 <object> 方案的核心区别：
    //   原方案：通过 objEl.contentDocument 进入 SVG 的 iframe 内部 DOM
    //   新方案：SVG 已在主页面 DOM 中，直接 querySelectorAll 查找 shape
    // =====================================================
    function initSvgHotspot(svgEl) {
      // 读取关联元素
      const glowEl      = svgEl.dataset.glow
                          ? document.getElementById(svgEl.dataset.glow)
                          : null;
      const tooltipEl   = svgEl.dataset.tooltip
                          ? document.getElementById(svgEl.dataset.tooltip)
                          : null;
      const highlightEl = svgEl.dataset.highlight
                          ? document.getElementById(svgEl.dataset.highlight)
                          : null;
      const target = svgEl.dataset.target;

      // 查找该 SVG 内所有热区形状（已有 class="hotspot-shape"）
      const shapes = svgEl.querySelectorAll('.hotspot-shape');

      // hover 显示：光点 / tooltip / 高亮
      function showHover() {
        if (glowEl)      glowEl.classList.add('visible');
        if (tooltipEl)   tooltipEl.classList.add('visible');
        if (highlightEl) highlightEl.classList.add('visible');
      }

      // hover 隐藏
      function hideHover() {
        if (glowEl)      glowEl.classList.remove('visible');
        if (tooltipEl)   tooltipEl.classList.remove('visible');
        if (highlightEl) highlightEl.classList.remove('visible');
      }

      // 给每个 shape 绑定事件
      shapes.forEach(shape => {
        shape.addEventListener('mouseenter', showHover);
        shape.addEventListener('mouseleave', hideHover);
        shape.addEventListener('click', () => {
          window.location.href = target;
        });
      });
    }

    // ===== 首次访问 / 刷新判断 =====
    const navEntry   = performance.getEntriesByType('navigation')[0];
    const isReload   = navEntry && navEntry.type === 'reload';
    const hasVisited = sessionStorage.getItem('frin_intro_played');
    const playIntro  = isReload || !hasVisited;

    sessionStorage.setItem('frin_intro_played', '1');

    if (playIntro) {
      // ===== 播放进场动画 =====
      video.play();

      video.addEventListener('timeupdate', () => {
        const t = video.currentTime;
        // 顶部黑条 + 底部黑条同步进场
        const barOp             = getOpacity(BAR_KEYFRAMES, t);
        headerBar.style.opacity = barOp;
        footer.style.opacity    = barOp;
        // 标题文字 + 导航文字同步进场
        const titleOp               = getOpacity(TITLE_KEYFRAMES, t);
        titleOverlay.style.opacity  = titleOp;
        headerContent.style.opacity = titleOp;
      });

      video.addEventListener('ended', () => {
        showFinalState();
        headerContent.classList.add('interactive');
        // 视频结束后 0.2s 激活热区层
        setTimeout(() => hotspotLayer.classList.add('active'), 200);
      });

    } else {
      // ===== 从子页面返回：跳过动画，直接显示末帧 =====
      video.style.opacity = '0';

      function revealLastFrame() {
        if (isNaN(video.duration)) return;
        video.currentTime = video.duration - 0.001;
        video.addEventListener('seeked', () => {
          video.style.transition = 'opacity 0.3s ease';
          video.style.opacity    = '1';
        }, { once: true });
      }

      if (video.readyState >= 1) {
        revealLastFrame();
      } else {
        video.addEventListener('loadedmetadata', revealLastFrame, { once: true });
      }

      showFinalState();
      hotspotLayer.classList.add('active');
    }

    // ===== 初始化所有内联 SVG 热区 =====
    document.querySelectorAll('.hotspot-svg').forEach(initSvgHotspot);

  </script>
</body>
</html>
