<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIN - Fuji Research Institute of Neuroscience</title>
  <style>

    /* ===== Palatino Linotype 字体本地加载 ===== */
    @font-face {
      font-family: 'PalatinoLinotype';
      src: url('asset/palai.ttf') format('truetype');
      font-style: italic;
      font-weight: normal;
    }

    /* ===== 全局重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== body：渐变背景，锁死视口，禁止滚动 ===== */
    body {
      background: linear-gradient(to bottom, #585858, #c64aef);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===================================================
       顶部 header：分两层
       - #header-bar    ：纯黑深色条背景，BAR_KEYFRAMES 控制
       - #header-content：logo + 导航文字，TITLE_KEYFRAMES 控制
    =================================================== */
    #header-bar {
      position: relative;
      width: 100%;
      height: 8.15vh;
      background: #000000;   /* 纯黑 */
      flex-shrink: 0;
      opacity: 0;            /* BAR_KEYFRAMES 控制 */
      z-index: 100;
    }

    /* 内容层：绝对定位在黑条上方，独立控制透明度 */
    #header-content {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      padding: 0 2.5vw;
      opacity: 0;            /* TITLE_KEYFRAMES 控制 */
      pointer-events: none;
    }

    /* 文字可点击时开启 pointer-events */
    #header-content.interactive {
      pointer-events: all;
    }

    /* FRIN Logo */
    .frin-logo {
      height: 70%;
      width: auto;
      margin-right: 3vw;
    }

    /* 导航链接 */
    nav { display: flex; gap: 4.5vw; }

    nav a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px);
      color: #5a585b;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    nav a:hover  { color: #c8c8c8; }
    nav a.active { color: #ff31eb; }

    /* ===== 场景容器：剩余高度，居中放置 16:9 内容 ===== */
    .scene-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      overflow: hidden;
    }

    /* ===== 主场景：JS 计算 px 尺寸 ===== */
    .scene {
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* 视频铺满场景 */
    .scene video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== 大标题覆盖层 ===== */
    .title-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 48%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 3%;
      opacity: 0;            /* TITLE_KEYFRAMES 控制 */
      pointer-events: none;
      z-index: 10;
    }

    .title-line {
      font-family: 'Verdana', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: clamp(16px, 5.8vw, 112px);
      color: #ffffff;
      line-height: 1.18;
      display: block;
    }

    .title-line .initial { color: #ff31eb; }

    .title-of {
      font-family: 'PalatinoLinotype', 'Palatino Linotype', Palatino, serif;
      font-weight: normal;
      font-style: italic;
      font-size: clamp(13px, 4.5vw, 86px);
      color: #ffffff;
      line-height: 1.18;
      display: block;
    }

    /* ===== 热区层 ===== */
    .hotspot-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 20;
    }

    .hotspot-layer.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===== SVG 热区 object 元素：铺满场景，透明不可见 ===== */
    /* pointer-events: all 确保透明区域也能接收事件 */
    .hotspot-obj {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: all;
      cursor: pointer;
    }

    /* ===== highlight SVG 覆盖：hover 时淡入 ===== */
    .hotspot-highlight {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 25;
    }

    .hotspot-highlight.visible { opacity: 1; }

    /* ===== 光点辉光 ===== */
    .glow-point {
      position: absolute;
      width: 2.5%;
      padding-bottom: 2.5%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      transition: opacity 0.25s ease;
      z-index: 30;
    }

    .glow-point.visible {
      opacity: 1;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 0.85; }
      50%       { transform: translate(-50%, -50%) scale(1.8); opacity: 1;    }
    }

    /* ===== Tooltip ===== */
    .tooltip {
      position: absolute;
      background: rgba(14, 0, 22, 0.9);
      border: 1px solid rgba(198, 74, 239, 0.55);
      padding: 1% 1.4%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
      transform: translate(-50%, -120%);
      white-space: nowrap;
    }

    .tooltip.visible { opacity: 1; }

    .tooltip .region-name {
      font-family: 'Times New Roman', serif;
      font-size: clamp(7px, 0.65vw, 12px);
      color: #5a585b;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      display: block;
      margin-bottom: 0.3em;
    }

    .tooltip .region-function {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(11px, 1.05vw, 19px);
      color: #ff31eb;
      display: block;
      margin-bottom: 0.5em;
    }

    .tooltip .region-link {
      font-family: 'Times New Roman', serif;
      font-size: clamp(9px, 0.8vw, 14px);
      color: #ffffff;
      text-decoration: none;
      pointer-events: all;
      transition: color 0.25s;
    }

    .tooltip .region-link:hover { color: #edc969; }

    /* ===== 底部条块：纯黑，全宽 ===== */
    #footer {
      width: 100%;
      background: #000000;   /* 纯黑 */
      padding: 0 3vw;
      height: 5.56vh;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-shrink: 0;
      opacity: 0;            /* BAR_KEYFRAMES 控制，与顶部黑条同步 */
    }

    #footer a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px);
      color: #ff31eb;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    #footer a:hover { color: #ffffff; }

  </style>
</head>
<body>

  <!-- ===== 顶部黑条（背景层 + 内容层分离控制透明度） ===== -->
  <div id="header-bar">
    <div id="header-content">
      <img class="frin-logo" src="asset/frinLogo.png" alt="FRIN Logo">
      <nav>
        <a href="index.html" class="active">homepage</a>
        <a href="recruit.html">recruit</a>
        <a href="now.html">now</a>
        <a href="contact.html">contact us</a>
      </nav>
    </div>
  </div>

  <!-- ===== 场景容器 ===== -->
  <div class="scene-container" id="scene-container">
    <div class="scene" id="scene">

      <!-- 进场动画视频 -->
      <video id="intro-video" muted playsinline>
        <source src="asset/MainLoadingBottom.mp4" type="video/mp4">
      </video>

      <!-- 大标题覆盖层 -->
      <div class="title-overlay" id="title-overlay">
        <span class="title-line"><span class="initial">F</span>uji</span>
        <span class="title-line"><span class="initial">R</span>esearch</span>
        <span class="title-line"><span class="initial">I</span>nstitute</span>
        <span class="title-of">of</span>
        <span class="title-line"><span class="initial">N</span>euroscience</span>
      </div>

      <!-- 热区层（视频结束后激活） -->
      <div class="hotspot-layer" id="hotspot-layer">

        <!-- ── Reward：SVG 热区 + highlight + 光点 + tooltip ── -->
        <object class="hotspot-obj" id="obj-reward"
                data="asset/area_reward.svg"
                type="image/svg+xml"
                data-glow="glow-reward"
                data-tooltip="tooltip-reward"
                data-highlight="hl-reward"
                data-target="reward.html">
        </object>
        <img class="hotspot-highlight" id="hl-reward"
             src="asset/highlight-reward.svg" alt="">
        <div class="glow-point" id="glow-reward"
             style="left:53.5%; top:60%;
                    background:radial-gradient(circle,#edc969 0%,rgba(237,201,105,0.2) 60%,transparent 100%);
                    box-shadow:0 0 16px 8px rgba(237,201,105,0.5);">
        </div>
        <div class="tooltip" id="tooltip-reward" style="left:53.5%; top:57%;">
          <span class="region-name">Nucleus Accumbens</span>
          <span class="region-function">Reward</span>
          <a class="region-link" href="reward.html">Awards &amp; Recognition →</a>
        </div>

        <!-- ── Vision：SVG 热区 + highlight + 光点 + tooltip ── -->
        <object class="hotspot-obj" id="obj-vision"
                data="asset/area_vision.svg"
                type="image/svg+xml"
                data-glow="glow-vision"
                data-tooltip="tooltip-vision"
                data-highlight="hl-vision"
                data-target="vision.html">
        </object>
        <img class="hotspot-highlight" id="hl-vision"
             src="asset/highlight-vision.svg" alt="">
        <div class="glow-point" id="glow-vision"
             style="left:77.5%; top:29%;
                    background:radial-gradient(circle,#edc969 0%,rgba(237,201,105,0.2) 60%,transparent 100%);
                    box-shadow:0 0 16px 8px rgba(237,201,105,0.5);">
        </div>
        <div class="tooltip" id="tooltip-vision" style="left:77.5%; top:26%;">
          <span class="region-name">Visual Cortex</span>
          <span class="region-function">Vision</span>
          <a class="region-link" href="vision.html">Visual Research →</a>
        </div>

        <!-- ── Secret：SVG 热区 + 光点（无 tooltip，无 highlight） ── -->
        <object class="hotspot-obj" id="obj-secret"
                data="asset/area_secret.svg"
                type="image/svg+xml"
                data-glow="glow-secret"
                data-target="secret.html">
        </object>
        <div class="glow-point" id="glow-secret"
             style="left:65.5%; top:46.5%;
                    background:radial-gradient(circle,#b2002a 0%,rgba(178,0,42,0.2) 60%,transparent 100%);
                    box-shadow:0 0 16px 8px rgba(178,0,42,0.45);">
        </div>

      </div><!-- /hotspot-layer -->
    </div><!-- /scene -->
  </div><!-- /scene-container -->

  <!-- ===== 底部纯黑条：与顶部黑条同步进场 ===== -->
  <footer id="footer">
    <a href="questionnaire.html">questionnaire→</a>
  </footer>


  <script>

    // ===== 关键帧：顶部黑条 + 底部黑条同步进场（帧 7-11，8fps） =====
    const BAR_KEYFRAMES = [
      { time: 0.875, opacity: 0.10 },
      { time: 1.000, opacity: 0.20 },
      { time: 1.125, opacity: 0.40 },
      { time: 1.250, opacity: 0.80 },
      { time: 1.375, opacity: 1.00 },
    ];

    // ===== 关键帧：标题文字 + 导航文字 + logo 同步进场（帧 13-17，8fps） =====
    const TITLE_KEYFRAMES = [
      { time: 1.625, opacity: 0.00 },
      { time: 1.750, opacity: 0.10 },
      { time: 1.875, opacity: 0.60 },
      { time: 2.000, opacity: 0.80 },
      { time: 2.125, opacity: 1.00 },
    ];

    // ===== smooth-step 补间函数 =====
    function smoothstep(a, b, t) {
      t = Math.max(0, Math.min(1, t));
      t = t * t * (3 - 2 * t);
      return a + (b - a) * t;
    }

    // ===== 根据当前播放时间插值 opacity =====
    function getOpacity(keyframes, currentTime) {
      if (currentTime <= keyframes[0].time) return keyframes[0].opacity;
      if (currentTime >= keyframes[keyframes.length - 1].time) return 1;
      for (let i = 0; i < keyframes.length - 1; i++) {
        const a = keyframes[i], b = keyframes[i + 1];
        if (currentTime >= a.time && currentTime <= b.time) {
          const t = (currentTime - a.time) / (b.time - a.time);
          return smoothstep(a.opacity, b.opacity, t);
        }
      }
      return 0;
    }

    // ===== DOM 元素引用 =====
    const video          = document.getElementById('intro-video');
    const headerBar      = document.getElementById('header-bar');
    const headerContent  = document.getElementById('header-content');
    const titleOverlay   = document.getElementById('title-overlay');
    const footer         = document.getElementById('footer');
    const hotspotLayer   = document.getElementById('hotspot-layer');
    const scene          = document.getElementById('scene');
    const sceneContainer = document.getElementById('scene-container');

    // ===== scene 尺寸：保持 16:9，居中，两侧透出渐变背景 =====
    function resizeScene() {
      const availW = sceneContainer.clientWidth;
      const availH = sceneContainer.clientHeight;
      let w, h;
      if (availW / availH >= 16 / 9) {
        h = availH;
        w = h * 16 / 9;
      } else {
        w = availW;
        h = w * 9 / 16;
      }
      scene.style.width  = w + 'px';
      scene.style.height = h + 'px';
    }

    resizeScene();
    window.addEventListener('resize', resizeScene);

    // ===== 所有元素设为最终显示态 =====
    function showFinalState() {
      headerBar.style.opacity     = 1;
      headerContent.style.opacity = 1;
      headerContent.classList.add('interactive');
      titleOverlay.style.opacity  = 1;
      footer.style.opacity        = 1;
    }

    // ===== SVG 热区初始化：读取 object 内部路径，绑定交互事件 =====
    // 注意：此方法需要通过本地服务器（如 VS Code Live Server）运行
    // 直接双击 HTML 文件（file://）浏览器会阻止跨域读取 SVG 内容
    function initSvgHotspot(objEl) {
      const glowEl      = document.getElementById(objEl.dataset.glow);
      const tooltipEl   = objEl.dataset.tooltip
                          ? document.getElementById(objEl.dataset.tooltip)
                          : null;
      const highlightEl = objEl.dataset.highlight
                          ? document.getElementById(objEl.dataset.highlight)
                          : null;
      const target = objEl.dataset.target;

      function bindToShapes() {
        try {
          const svgDoc = objEl.contentDocument;
          if (!svgDoc) return;

          // 选取 SVG 内所有可见形状元素
          const shapes = svgDoc.querySelectorAll('path, polygon, circle, ellipse, rect');
          if (shapes.length === 0) return;

          shapes.forEach(shape => {
            // 将形状变透明，但保留 pointer-events（all = 透明区域也响应）
            shape.style.fill          = 'transparent';
            shape.style.stroke        = 'none';
            shape.style.pointerEvents = 'all';
            shape.style.cursor        = 'pointer';

            // 鼠标进入：显示光点 / tooltip / highlight
            shape.addEventListener('mouseenter', () => {
              if (glowEl)      glowEl.classList.add('visible');
              if (tooltipEl)   tooltipEl.classList.add('visible');
              if (highlightEl) highlightEl.classList.add('visible');
            });

            // 鼠标离开：隐藏
            shape.addEventListener('mouseleave', () => {
              if (glowEl)      glowEl.classList.remove('visible');
              if (tooltipEl)   tooltipEl.classList.remove('visible');
              if (highlightEl) highlightEl.classList.remove('visible');
            });

            // 点击：跳转目标页面
            shape.addEventListener('click', () => {
              window.location.href = target;
            });
          });

        } catch (e) {
          // SVG contentDocument 访问失败时的静默降级（file:// 协议下）
          console.warn('SVG hotspot init failed for', objEl.id,
                       '— please use a local server (e.g. VS Code Live Server):', e.message);
        }
      }

      // SVG 已加载则直接初始化，否则等待 load 事件
      if (objEl.contentDocument &&
          objEl.contentDocument.readyState !== 'loading') {
        bindToShapes();
      } else {
        objEl.addEventListener('load', bindToShapes);
      }
    }

    // ===== 首次访问 / 刷新判断 =====
    const navEntry   = performance.getEntriesByType('navigation')[0];
    const isReload   = navEntry && navEntry.type === 'reload';
    const hasVisited = sessionStorage.getItem('frin_intro_played');
    const playIntro  = isReload || !hasVisited;

    sessionStorage.setItem('frin_intro_played', '1');

    if (playIntro) {
      // ===== 播放进场动画 =====
      video.play();

      video.addEventListener('timeupdate', () => {
        const t = video.currentTime;

        // 顶部黑条 + 底部黑条：同步进场
        const barOp             = getOpacity(BAR_KEYFRAMES, t);
        headerBar.style.opacity = barOp;
        footer.style.opacity    = barOp;

        // 标题文字 + 导航文字：同步进场
        const titleOp               = getOpacity(TITLE_KEYFRAMES, t);
        titleOverlay.style.opacity  = titleOp;
        headerContent.style.opacity = titleOp;
      });

      video.addEventListener('ended', () => {
        showFinalState();
        headerContent.classList.add('interactive');
        setTimeout(() => hotspotLayer.classList.add('active'), 200);
      });

    } else {
      // ===== 从子页面返回：跳过动画 =====
      video.addEventListener('loadedmetadata', () => {
        video.currentTime = video.duration;
      });
      video.load();
      showFinalState();
      hotspotLayer.classList.add('active');
    }

    // ===== 初始化所有 SVG 热区 =====
    document.querySelectorAll('.hotspot-obj').forEach(initSvgHotspot);

  </script>
</body>
</html>
