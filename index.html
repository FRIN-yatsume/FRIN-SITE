<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIN - Fuji Research Institute of Neuroscience</title>
  <style>

    /* ===== Palatino Linotype 字体本地加载 ===== */
    @font-face {
      font-family: 'PalatinoLinotype';
      src: url('asset/palai.ttf') format('truetype');
      font-style: italic;
      font-weight: normal;
    }

    /* ===== 全局重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== body：背景渐变，纵向弹性布局 ===== */
    body {
      background: linear-gradient(to bottom, #585858, #c64aef);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ===== 顶部导航栏 ===== */
    header {
      background: linear-gradient(to bottom, #1a1a1a, #333333);
      display: flex;
      align-items: center;
      padding: 0 2.5vw;
      height: 88px;
      flex-shrink: 0;
      opacity: 0; /* 初始透明，随标题一起进场 */
      z-index: 100;
    }

    /* FRIN Logo 图片 */
    .frin-logo {
      width: 72px;
      height: auto;
      margin-right: 3.5vw;
    }

    /* 导航链接容器 */
    nav {
      display: flex;
      gap: 5vw;
    }

    /* 导航链接样式 */
    nav a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: 18pt;
      color: #5a585b;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    nav a:hover { color: #c8c8c8; }

    /* 当前页高亮 */
    nav a.active { color: #ff31eb; }

    /* ===== 主场景容器：16:9 比例锁定 ===== */
    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ===== 进场视频：全填充场景 ===== */
    .scene video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== 标题覆盖层：绝对定位在视频左侧 ===== */
    .title-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 48%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 3vw;
      opacity: 0; /* 初始透明，JS 控制进场 */
      pointer-events: none;
      z-index: 10;
    }

    /* 标题行：主字体 Verdana Bold Italic */
    .title-line {
      font-family: 'Verdana', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: clamp(28px, 5.8vw, 110px);
      color: #ffffff;
      line-height: 1.18;
      display: block;
    }

    /* 每行开头字母单独染色为粉紫色 */
    .title-line .initial {
      color: #ff31eb;
    }

    /* "of" 行：Palatino Linotype Italic，字号略小 */
    .title-of {
      font-family: 'PalatinoLinotype', 'Palatino Linotype', Palatino, serif;
      font-weight: normal;
      font-style: italic;
      font-size: clamp(22px, 4.5vw, 84px);
      color: #ffffff;
      line-height: 1.18;
      display: block;
    }

    /* ===== 热区层：视频结束后淡入 ===== */
    .hotspot-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 20;
    }

    /* 激活状态 */
    .hotspot-layer.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===== 单个热区触发区（椭圆透明div） ===== */
    .hotspot-trigger {
      position: absolute;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      /* 调试用：取消下行注释可看到热区范围 */
      /* outline: 2px dashed rgba(255,255,255,0.3); */
    }

    /* ===== 光点辉光 ===== */
    .glow-point {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      transition: opacity 0.25s ease;
      z-index: 30;
    }

    /* 光点显示时加脉冲动画 */
    .glow-point.visible {
      opacity: 1;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 0.85; }
      50%       { transform: translate(-50%, -50%) scale(1.7); opacity: 1;    }
    }

    /* ===== Tooltip 弹出框 ===== */
    .tooltip {
      position: absolute;
      background: rgba(18, 0, 26, 0.88);
      border: 1px solid rgba(198, 74, 239, 0.6);
      padding: 12px 16px;
      min-width: 180px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
      transform: translate(-50%, -115%);
    }

    .tooltip.visible { opacity: 1; }

    /* Tooltip：脑区名称（小字） */
    .tooltip .region-name {
      font-family: 'Times New Roman', serif;
      font-size: 11px;
      color: #5a585b;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      display: block;
      margin-bottom: 5px;
    }

    /* Tooltip：功能关键词（大字） */
    .tooltip .region-function {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: 17px;
      color: #ff31eb;
      display: block;
      margin-bottom: 8px;
    }

    /* Tooltip：跳转链接 */
    .tooltip .region-link {
      font-family: 'Times New Roman', serif;
      font-size: 13px;
      color: #ffffff;
      text-decoration: none;
      pointer-events: all;
      transition: color 0.25s;
    }

    .tooltip .region-link:hover { color: #edc969; }

    /* ===== 底部条块 ===== */
    footer {
      background: #1a0020;
      padding: 18px 3vw;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-shrink: 0;
      opacity: 0; /* 初始透明，JS 控制进场 */
    }

    footer a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: 18pt;
      color: #ff31eb;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    footer a:hover { color: #ffffff; }

  </style>
</head>
<body>

  <!-- ===== 顶部导航栏 ===== -->
  <header id="header">
    <img class="frin-logo" src="asset/frinLogo.png" alt="FRIN Logo" id="frin-logo">
    <nav>
      <a href="index.html" class="active">homepage</a>
      <a href="recruit.html">recruit</a>
      <a href="now.html">now</a>
      <a href="contact.html">contact us</a>
    </nav>
  </header>

  <!-- ===== 主场景（视频 + 所有覆盖层） ===== -->
  <div class="scene" id="scene">

    <!-- 进场动画视频，播完自动停在末帧 -->
    <video id="intro-video" autoplay muted playsinline>
      <source src="asset/MainLoadingBottom.mp4" type="video/mp4">
    </video>

    <!-- 大标题覆盖层（左侧） -->
    <div class="title-overlay" id="title-overlay">
      <span class="title-line"><span class="initial">F</span>uji</span>
      <span class="title-line"><span class="initial">R</span>esearch</span>
      <span class="title-line"><span class="initial">I</span>nstitute</span>
      <span class="title-of">of</span>
      <span class="title-line"><span class="initial">N</span>euroscience</span>
    </div>

    <!-- 热区层（视频结束 0.2s 后激活） -->
    <div class="hotspot-layer" id="hotspot-layer">

      <!-- ── Reward 热区触发区（Nucleus Accumbens） ── -->
      <div class="hotspot-trigger" id="trigger-reward"
           style="left: 49%; top: 57%; width: 9%; padding-bottom: 6%;"
           data-glow="glow-reward"
           data-tooltip="tooltip-reward"
           data-target="reward.html">
      </div>

      <!-- Reward 光点（黄色辉光） -->
      <div class="glow-point" id="glow-reward"
           style="left: 53.5%; top: 60%;
                  background: radial-gradient(circle, #edc969 0%, rgba(237,201,105,0.3) 60%, transparent 100%);
                  box-shadow: 0 0 14px 7px rgba(237,201,105,0.55);">
      </div>

      <!-- Reward Tooltip -->
      <div class="tooltip" id="tooltip-reward" style="left: 53.5%; top: 57%;">
        <span class="region-name">Nucleus Accumbens</span>
        <span class="region-function">Reward</span>
        <a class="region-link" href="reward.html">Awards &amp; Recognition →</a>
      </div>

      <!-- ── Vision 热区触发区（Visual Cortex） ── -->
      <div class="hotspot-trigger" id="trigger-vision"
           style="left: 73%; top: 26%; width: 9%; padding-bottom: 6%;"
           data-glow="glow-vision"
           data-tooltip="tooltip-vision"
           data-target="vision.html">
      </div>

      <!-- Vision 光点（黄色辉光，与 Reward 相同） -->
      <div class="glow-point" id="glow-vision"
           style="left: 77.5%; top: 29%;
                  background: radial-gradient(circle, #edc969 0%, rgba(237,201,105,0.3) 60%, transparent 100%);
                  box-shadow: 0 0 14px 7px rgba(237,201,105,0.55);">
      </div>

      <!-- Vision Tooltip -->
      <div class="tooltip" id="tooltip-vision" style="left: 77.5%; top: 26%;">
        <span class="region-name">Visual Cortex</span>
        <span class="region-function">Vision</span>
        <a class="region-link" href="vision.html">Visual Research →</a>
      </div>

      <!-- ── Secret 热区触发区（无 tooltip，仅红点） ── -->
      <div class="hotspot-trigger" id="trigger-secret"
           style="left: 62%; top: 44%; width: 7%; padding-bottom: 5%;"
           data-glow="glow-secret"
           data-target="secret.html">
      </div>

      <!-- Secret 光点（红色辉光，无 tooltip） -->
      <div class="glow-point" id="glow-secret"
           style="left: 65.5%; top: 46.5%;
                  background: radial-gradient(circle, #b2002a 0%, rgba(178,0,42,0.3) 60%, transparent 100%);
                  box-shadow: 0 0 14px 7px rgba(178,0,42,0.5);">
      </div>

    </div><!-- /hotspot-layer -->

  </div><!-- /scene -->

  <!-- ===== 底部条块 ===== -->
  <footer id="footer">
    <a href="#">questionnaire→</a>
  </footer>


  <script>

    // ===== 关键帧数据：底部条块进场（帧 7-11，8fps） =====
    const BAR_KEYFRAMES = [
      { time: 0.875, opacity: 0.10 },
      { time: 1.000, opacity: 0.20 },
      { time: 1.125, opacity: 0.40 },
      { time: 1.250, opacity: 0.80 },
      { time: 1.375, opacity: 1.00 },
    ];

    // ===== 关键帧数据：标题 + header 进场（帧 13-17，8fps） =====
    const TITLE_KEYFRAMES = [
      { time: 1.625, opacity: 0.00 },
      { time: 1.750, opacity: 0.10 },
      { time: 1.875, opacity: 0.60 },
      { time: 2.000, opacity: 0.80 },
      { time: 2.125, opacity: 1.00 },
    ];

    // ===== smooth-step 补间：比线性更自然，接近动画软件的缓动 =====
    function smoothstep(a, b, t) {
      t = Math.max(0, Math.min(1, t));
      t = t * t * (3 - 2 * t);
      return a + (b - a) * t;
    }

    // ===== 根据当前时间在关键帧之间插值出 opacity =====
    function getOpacity(keyframes, currentTime) {
      if (currentTime <= keyframes[0].time) return keyframes[0].opacity;
      if (currentTime >= keyframes[keyframes.length - 1].time) return 1;
      for (let i = 0; i < keyframes.length - 1; i++) {
        const a = keyframes[i], b = keyframes[i + 1];
        if (currentTime >= a.time && currentTime <= b.time) {
          const t = (currentTime - a.time) / (b.time - a.time);
          return smoothstep(a.opacity, b.opacity, t);
        }
      }
      return 0;
    }

    // ===== 获取需要动画控制的 DOM 元素 =====
    const video        = document.getElementById('intro-video');
    const footer       = document.getElementById('footer');
    const titleOverlay = document.getElementById('title-overlay');
    const header       = document.getElementById('header');
    const hotspotLayer = document.getElementById('hotspot-layer');

    // ===== 视频播放中：用 timeupdate 逐帧更新 UI 透明度 =====
    video.addEventListener('timeupdate', () => {
      const t = video.currentTime;
      footer.style.opacity       = getOpacity(BAR_KEYFRAMES, t);
      const titleOp              = getOpacity(TITLE_KEYFRAMES, t);
      titleOverlay.style.opacity = titleOp;
      header.style.opacity       = titleOp;
    });

    // ===== 视频结束：确保全部显示，然后激活热区 =====
    video.addEventListener('ended', () => {
      footer.style.opacity       = 1;
      titleOverlay.style.opacity = 1;
      header.style.opacity       = 1;

      // 延迟 0.2s 后热区淡入
      setTimeout(() => {
        hotspotLayer.classList.add('active');
      }, 200);
    });

    // ===== 热区交互：绑定所有 .hotspot-trigger 元素的事件 =====
    document.querySelectorAll('.hotspot-trigger').forEach(trigger => {
      const glowEl    = document.getElementById(trigger.dataset.glow);
      const tooltipEl = trigger.dataset.tooltip
                        ? document.getElementById(trigger.dataset.tooltip)
                        : null;
      const target    = trigger.dataset.target;

      // 鼠标进入：显示光点（有 tooltip 的同时显示 tooltip）
      trigger.addEventListener('mouseenter', () => {
        if (glowEl)    glowEl.classList.add('visible');
        if (tooltipEl) tooltipEl.classList.add('visible');
      });

      // 鼠标离开：隐藏光点和 tooltip
      trigger.addEventListener('mouseleave', () => {
        if (glowEl)    glowEl.classList.remove('visible');
        if (tooltipEl) tooltipEl.classList.remove('visible');
      });

      // 点击：跳转目标页面
      trigger.addEventListener('click', () => {
        window.location.href = target;
      });
    });

  </script>
</body>
</html>
