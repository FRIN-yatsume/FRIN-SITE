<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIN - Fuji Research Institute of Neuroscience</title>
  <style>

    /* ===== Palatino Linotype 字体本地加载 ===== */
    @font-face {
      font-family: 'PalatinoLinotype';
      src: url('asset/palai.ttf') format('truetype');
      font-style: italic;
      font-weight: normal;
    }

    /* ===== Libre Baskerville 字体本地加载 ===== */
    @font-face {
      font-family: 'LibreBaskerville';
      src: url('asset/LibreBaskerville-VariableFont_wght.ttf') format('truetype');
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
    }

    /* ===== Verdana 字体本地加载（标题用，of 除外） ===== */
    @font-face {
      font-family: 'VerdanaLocal';
      src: url('asset/verdanaz.ttf') format('truetype');
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    /* ===== 全局重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --content-inset-left: 2%;           /* 可调整-文字-布局：标题与 Logo 共用左缩进，变大→右移 */
      --title-block-offset-y: 28px;       /* 可调整-文字-布局：大标题整块上下，+向下 */
      --logo-offset-x: -35px;             /* 可调整-精灵-布局：Logo 单独左右，不改标题 */
      --logo-offset-y: 0;                 /* 可调整-精灵-布局：Logo 单独上下，+向下 */
      --right-edge-inset: 8.5%;           /* 可调整-文字-布局：右侧共用边距（nav / questionnaire） */
      --nav-align-right: var(--right-edge-inset);
      --nav-link-gap: 15vw;               /* 可调整-文字-布局：导航链接间距 */
      --nav-letter-spacing: 0.03em;       /* 可调整-文字-字间距：导航链接字间距 */
      --nav-bottom-gap: 0px;              /* 可调整-文字-布局：导航底距顶栏底，0=贴底 */
      --nav-offset-y: -18px;              /* 可调整-文字-布局：导航整体上下，+向下 */
      --nav-max-left: 20%;                /* 可调整-文字-布局：导航左边界，防压标题 */
      --title-of-offset-x: 15px;          /* 可调整-文字-布局：of 左右，+向右 */
      --title-of-offset-y: -24px;         /* 可调整-文字-布局：of 上下，+向下 */
      --title-of-skew-x: -9deg;           /* 可调整-文字-变换：of 额外倾斜角，负值更斜 */
      --title-of-skew-origin: left center; /* 可调整-文字-变换：of 倾斜支点 */
      --title-neuro-offset-x: -8px;       /* 可调整-文字-布局：Neuro 左右，+向右 */
      --title-neuro-offset-y: -50px;      /* 可调整-文字-布局：Neuro 上下，+向下 */

      --footer-bg: #000000;               /* 可调整-布局-底部黑条：背景色 */
      --footer-height: 12vh;              /* 可调整-布局-底部黑条：高度 */
      --footer-padding-x: var(--right-edge-inset); /* 可调整-布局-底部黑条：左右内边距 */
      --footer-offset-y: 10px;            /* 可调整-布局-底部黑条：整体上下，+向下 */
      --footer-content-justify: flex-end; /* 可调整-文字-布局：questionnaire 水平对齐 */

      --questionnaire-color: #c64aef;       /* 可调整-文字-颜色：questionnaire 字色 */
      --questionnaire-hover-color: #ffffff; /* 可调整-文字-颜色：questionnaire hover 字色 */
      --questionnaire-letter-spacing: 0.04em; /* 可调整-文字-字间距：questionnaire 字间距 */
      --questionnaire-top-gap: 18px;        /* 可调整-文字-布局：链接顶距底栏顶，0=贴顶 */
      --questionnaire-offset-x: 18px;       /* 可调整-文字-布局：questionnaire 左右，+向右 */
    }

    /* ===== body：页面背景渐变，锁死视口，禁止滚动 ===== */
    body {
      background: linear-gradient(to bottom, #585858, #c64aef); /* 可调整-文字-颜色：页面背景渐变，上→下 */
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== 顶部 header：#header-bar 背景层 + #header-content 内容层 ===== */
    #header-bar {
      position: relative;
      width: 100%;
      height: 19vh;         /* 可调整-布局-顶部黑条：高度 */
      background: #000000;  /* 可调整-布局-顶部黑条：背景色 */
      flex-shrink: 0;
      opacity: 0;           /* 说明：进场动画初值，勿改 */
      z-index: 100;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1); /* 可调整-动画-时长：顶栏淡入 */
    }

    #header-content {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;  /* 可调整-精灵-布局：Logo 在黑条内垂直对齐 */
      padding: 0 0 0 var(--content-inset-left);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #header-content.interactive {
      pointer-events: all;
    }

    .frin-logo {
      height: clamp(22px, 14vh, 130px); /* 可调整-精灵-缩放：Logo 高度 clamp */
      width: auto;
      flex-shrink: 0;
      display: block;
      margin-left: var(--logo-offset-x);
      margin-top: var(--logo-offset-y);
    }

    nav {
      position: absolute;
      top: 0;
      right: var(--nav-align-right);
      left: var(--nav-max-left);
      height: 100%;
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: flex-end;
      gap: var(--nav-link-gap);
      padding-bottom: var(--nav-bottom-gap);
      transform: translateY(var(--nav-offset-y));
    }

    nav a {
      font-family: 'LibreBaskerville', 'Libre Baskerville', serif; /* 可调整-文字-字体：导航字体族 */
      font-weight: bold;
      font-size: clamp(10px, 1.3vw, 48px);  /* 可调整-文字-大小：导航字号 clamp */
      color: #5a585b;                        /* 可调整-文字-颜色：导航字色 */
      text-decoration: none;
      letter-spacing: var(--nav-letter-spacing);
      transition: color 0.3s;
      white-space: nowrap;
    }

    nav a:hover  { color: #c8c8c8; }   /* 可调整-文字-颜色：导航 hover */
    nav a.active { color: #d6d6d6; }   /* 可调整-文字-颜色：导航当前页 */

    /* ===== 场景容器：剩余视口高度，居中放置内容 ===== */
    .scene-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      overflow: hidden;
    }

    /* ===== 主场景：全屏固定定位 ===== */
    .scene {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;  /* 可调整-布局-场景尺寸：视口全屏 */
      overflow: hidden;
      z-index: 0;
    }

    /* 进场视频铺满场景 */
    .scene video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;    /* 可调整-布局-场景尺寸：视频填充 cover/contain */
      display: block;
    }

    /* ===== 左侧大标题覆盖层 ===== */
    .title-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 48%;           /* 可调整-文字-布局：标题区宽度比例 */
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center; /* 可调整-文字-布局：标题块垂直对齐 */
      padding-left: var(--content-inset-left);
      transform: translateY(var(--title-block-offset-y));
      opacity: 0;
      pointer-events: none;
      z-index: 105; /* 说明：须高于 #header-bar(100) */
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 标题每一行（Fuji / Research / Institute / Neuroscience） */
    .title-line {
      font-family: 'VerdanaLocal', Verdana, sans-serif; /* 可调整-文字-字体：标题字体族 */
      font-weight: bold;
      font-style: italic;
      font-size: clamp(16px, 5.7vw, 112px); /* 可调整-文字-大小：标题字号 clamp */
      color: #ffffff;                        /* 可调整-文字-颜色：标题字色 */
      line-height: 1.63;                     /* 可调整-文字-行距：标题行距 */
      display: block;
    }

    /* 每行开头大写字母（F / R / I / N） */
    .title-line .initial {
      color: #ff31eb; /* 可调整-文字-颜色：标题首字母色 */
    }

    .title-of {
      font-family: 'PalatinoLinotype', 'Palatino Linotype', Palatino, serif; /* 可调整-文字-字体：of 字体族 */
      font-weight: normal;
      font-style: italic;
      font-size: clamp(13px, 5vw, 120px); /* 可调整-文字-大小：of 字号 clamp */
      color: #ffffff;                       /* 可调整-文字-颜色：of 字色 */
      line-height: 1.18;                    /* 可调整-文字-行距：of 行距 */
      display: block;
      margin-left: var(--title-of-offset-x);
      margin-top: var(--title-of-offset-y);
      transform: skewX(var(--title-of-skew-x));
      transform-origin: var(--title-of-skew-origin);
    }

    .title-line-neuro {
      margin-left: var(--title-neuro-offset-x);
      margin-top: var(--title-neuro-offset-y);
    }

    /* ===== 热区层：视频结束后 fade in 激活 ===== */
    .hotspot-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease; /* 可调整-动画-时长：热区层淡入 */
      z-index: 20;
    }

    .hotspot-layer.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===== 内联 SVG 热区（1920×1080，与视频对齐） ===== */
    .hotspot-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
      pointer-events: none; /* 说明：事件由 .hotspot-shape 接收 */
    }

    .hotspot-svg .hotspot-shape {
      /* 可调整-热区-可见性：正式=下行；调试=注释下行并启用下方块 */
      fill: transparent;
      stroke: none;

      /* 可调整-热区-可见性（调试，取消注释并注释上面两行）：
      fill: rgba(255, 0, 0, 0.3);
      stroke: #ff0000;
      stroke-width: 2;
      */

      pointer-events: all;
      cursor: pointer;
    }

    /* ===== 光点辉光 ===== */
    .glow-point {
      position: fixed;
      width: 20px;          /* 可调整-精灵-缩放：光点直径 */
      height: 20px;
      border-radius: 50%;
      transform: translate(-50%, -50%); /* 说明：光点中心锚点，勿改 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;   /* 可调整-动画-时长：光点显隐 */
      z-index: 30;
    }

    .glow-point.visible {
      opacity: 1;
    }

    /* ===== Tooltip（脑区提示框） ===== */
    .tooltip {
      position: fixed;
      background: rgba(14, 0, 22, 0.9);          /* 可调整-文字-颜色：Tooltip 背景 */
      border: 1px solid rgba(198, 74, 239, 0.55); /* 可调整-文字-颜色：Tooltip 边框 */
      padding: 1% 1.4%;                           /* 可调整-文字-布局：Tooltip 内边距 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
      white-space: nowrap;
    }

    .tooltip.visible { opacity: 1; }

    /* 提示框第一行：脑区英文名（小字） */
    .tooltip .region-name {
      font-family: 'LibreBaskerville', 'Libre Baskerville', serif;     /* 可调整-文字-字体：脑区名字体族 */
      font-size: clamp(7px, 0.65vw, 12px);       /* 可调整-文字-大小：脑区名字号 */
      color: #5a585b;                            /* 可调整-文字-颜色：脑区名字色 */
      text-transform: uppercase;
      letter-spacing: 0.12em;                    /* 可调整-文字-字间距：脑区名字间距 */
      display: block;
      margin-bottom: 0.3em;                      /* 可调整-文字-布局：脑区名下行距 */
    }

    /* 提示框第二行：功能关键词（大字，品牌色） */
    .tooltip .region-function {
      font-family: 'LibreBaskerville', 'Libre Baskerville', serif;       /* 可调整-文字-字体：关键词字体族 */
      font-weight: bold;
      font-size: clamp(11px, 1.05vw, 19px);      /* 可调整-文字-大小：关键词字号 */
      color: #ff31eb;                            /* 可调整-文字-颜色：关键词字色 */
      display: block;
      margin-bottom: 0.5em;                      /* 可调整-文字-布局：关键词下行距 */
    }

    /* 提示框第三行：跳转链接 */
    .tooltip .region-link {
      font-family: 'LibreBaskerville', 'Libre Baskerville', serif;     /* 可调整-文字-字体：链接字体族 */
      font-size: clamp(9px, 0.8vw, 14px);        /* 可调整-文字-大小：链接字号 */
      color: #ffffff;                            /* 可调整-文字-颜色：链接字色 */
      text-decoration: none;
      pointer-events: all;
      transition: color 0.25s;
    }

    .tooltip .region-link:hover {
      color: #edc969; /* 可调整-文字-颜色：链接 hover */
    }

    /* ===== 底部纯黑条 ===== */
    #footer {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      background: var(--footer-bg);
      padding: 0 var(--footer-padding-x);
      height: var(--footer-height);
      display: flex;
      justify-content: var(--footer-content-justify);
      align-items: flex-start;
      flex-shrink: 0;
      opacity: 0;
      z-index: 100;
      transform: translateY(var(--footer-offset-y));
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #footer a {
      font-family: 'LibreBaskerville', 'Libre Baskerville', serif;
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px); /* 可调整-文字-大小：questionnaire 字号 */
      color: var(--questionnaire-color);
      text-decoration: none;
      letter-spacing: var(--questionnaire-letter-spacing);
      margin-top: var(--questionnaire-top-gap);
      transform: translateX(var(--questionnaire-offset-x));
      transition: color 0.3s;
    }

    #footer a:hover {
      color: var(--questionnaire-hover-color);
    }

  </style>
</head>
<body>

  <!-- ===== 顶部黑条 ===== -->
  <div id="header-bar">
    <div id="header-content">
      <img class="frin-logo" src="asset/frinLogo.png" alt="FRIN Logo">
      <nav>
        <a href="index.html" class="active">homepage</a>

  <!-- 大标题覆盖层（body 同级，才能压过 #header-bar） -->
  <div class="title-overlay" id="title-overlay">
    <span class="title-line"><span class="initial">F</span>uji</span>

  <!-- ===== 场景容器 ===== -->
  <div class="scene-container" id="scene-container">

      <!-- 进场动画视频 -->
      <video id="intro-video" muted playsinline preload="auto">
        <source src="asset/MainLoadingBottom.mp4" type="video/mp4">
      </video>

      <!-- 可调整-热区-可见性：热区层（1920×1080）；调试见 CSS .hotspot-shape -->

        <svg class="hotspot-svg"

          <path class="hotspot-shape"
                d="M1211.38,613.37c2.31,27.48,83.22,125.62,83.22,125.62l43.92-62.81-110.97-62.81"/>
          <path class="hotspot-shape"
                d="M1443.98,214.52l-125.31,31.8,228.2,154.42s87.32,194.24,44.43,275.43c-5.45,10.32-157.79,135.12-157.79,135.12l137.87,27.57,78.13-52.09,100.45-98.16-7.92-167.4-41.36-101.11-80.28-103.64-70.47-62.81-105.95-39.16Z"/>

        <!-- 热区：Secret 彩蛋 → secret.html（无 tooltip） -->

             data-glow="glow-secret"

          <polyline class="hotspot-shape"

        <!-- 可调整-精灵-颜色：Secret 光点 -->

      </div><!-- /hotspot-layer -->
    </div><!-- /scene -->
  </div><!-- /scene-container -->

  <!-- ===== 底部纯黑条 ===== -->
  <footer id="footer">
    <a href="questionnaire.html">questionnaire→</a>
  </footer>


  <script>

    // ===== 进场动画关键帧：顶部黑条 + 底部黑条同步进场 =====
    const BAR_KEYFRAMES = [
      { time: 0.800, opacity: 0.10 },
      { time: 0.900, opacity: 0.20 },
      { time: 1.000, opacity: 0.40 },
      { time: 1.100, opacity: 0.80 },
      { time: 1.200, opacity: 1.00 },
    ];

    // ===== 进场动画关键帧：标题 + 导航 + Logo 同步进场 =====
    const TITLE_KEYFRAMES = [
      { time: 1.625, opacity: 0.00 },
      { time: 1.750, opacity: 0.10 },
      { time: 1.875, opacity: 0.60 },
      { time: 2.000, opacity: 0.80 },
      { time: 2.125, opacity: 1.00 },
    ];

    // ===== smooth-step 补间函数（模拟动画软件缓动） =====
    function smoothstep(a, b, t) {
      t = Math.max(0, Math.min(1, t));
      t = t * t * (3 - 2 * t);
      return a + (b - a) * t;
    }

    // ===== 根据当前视频时间插值出 opacity =====
    function getOpacity(keyframes, currentTime) {
      if (currentTime < keyframes[0].time) return 0;
      if (currentTime >= keyframes[keyframes.length - 1].time) return 1;
      for (let i = 0; i < keyframes.length - 1; i++) {
        const a = keyframes[i], b = keyframes[i + 1];
        if (currentTime >= a.time && currentTime <= b.time) {
          const t = (currentTime - a.time) / (b.time - a.time);
          return smoothstep(a.opacity, b.opacity, t);
        }
      }
      return 0;
    }

    // ===== DOM 元素引用 =====
    const video         = document.getElementById('intro-video');
    const headerBar     = document.getElementById('header-bar');
    const headerContent = document.getElementById('header-content');
    const titleOverlay  = document.getElementById('title-overlay');
    const footer        = document.getElementById('footer');
    const hotspotLayer  = document.getElementById('hotspot-layer');
    const scene         = document.getElementById('scene');

    // ===== 场景尺寸：保持全视口 =====
    function resizeScene() {
      scene.style.width  = window.innerWidth  + 'px';
      scene.style.height = window.innerHeight + 'px';
    }
    resizeScene();
    window.addEventListener('resize', resizeScene);

    // ===== 所有 UI 元素跳到最终显示态（跳过动画时调用） =====
    function showFinalState() {
      headerBar.style.opacity     = 1;
      headerContent.style.opacity = 1;
      headerContent.classList.add('interactive');
      titleOverlay.style.opacity  = 1;
      footer.style.opacity        = 1;
    }

    // =====================================================
    // 初始化内联 SVG 热区
    // 直接在页面 DOM 里查找 shape，不需要 contentDocument
    // =====================================================
    function initSvgHotspot(svgEl) {
      // 读取关联的光点和 tooltip 元素（通过 data-* 属性）
      const glowEl    = svgEl.dataset.glow
                        ? document.getElementById(svgEl.dataset.glow)
                        : null;
      const tooltipEl = svgEl.dataset.tooltip
                        ? document.getElementById(svgEl.dataset.tooltip)
                        : null;
      const target    = svgEl.dataset.target;

      // 查找该 SVG 内所有热区形状
      const shapes = svgEl.querySelectorAll('.hotspot-shape');

      // hover 进入：显示光点 + tooltip
      function showHover(e) {
        if (glowEl)    glowEl.classList.add('visible');
        if (tooltipEl) tooltipEl.classList.add('visible');
        updateHoverPosition(e);
      }

      // hover 离开：隐藏光点 + tooltip
      function hideHover() {
        if (glowEl)    glowEl.classList.remove('visible');
        if (tooltipEl) tooltipEl.classList.remove('visible');
      }

      // 更新光点和提示框位置到鼠标处
      function updateHoverPosition(e) {
        const x = e.clientX;
        const y = e.clientY;
        if (glowEl) {
          glowEl.style.left = x + 'px';
          glowEl.style.top = y + 'px';
        }
        if (tooltipEl) {
          tooltipEl.style.left = (x + 20) + 'px';
          tooltipEl.style.top = y + 'px';
        }
      }

      // 为每个 shape 绑定交互事件
      shapes.forEach(shape => {
        shape.addEventListener('mouseenter', showHover);
        shape.addEventListener('mouseleave', hideHover);
        shape.addEventListener('mousemove', updateHoverPosition);
        shape.addEventListener('click', () => {
          window.location.href = target;
        });
      });
    }

    // ===== 首次访问 vs 刷新 vs 从子页面返回 判断 =====
    const navEntry   = performance.getEntriesByType('navigation')[0];
    const isReload   = navEntry && navEntry.type === 'reload';
    const hasVisited = sessionStorage.getItem('frin_intro_played');
    const playIntro  = isReload || !hasVisited;

    sessionStorage.setItem('frin_intro_played', '1');

    if (playIntro) {
      // ── 首次访问 / 刷新：播放进场动画 ──
      video.play();

      let rafId = null;
      function refreshIntroOpacity() {
        const t = video.currentTime;
        // 顶部 + 底部黑条同步淡入
        const barOp             = getOpacity(BAR_KEYFRAMES, t);
        headerBar.style.opacity = barOp;
        footer.style.opacity    = barOp;
        // 标题 + 导航同步淡入
        const titleOp               = getOpacity(TITLE_KEYFRAMES, t);
        titleOverlay.style.opacity  = titleOp;
        headerContent.style.opacity = titleOp;

        if (!video.paused && !video.ended) {
          rafId = requestAnimationFrame(refreshIntroOpacity);
        } else {
          rafId = null;
        }
      }

      video.addEventListener('play', () => {
        if (rafId === null) rafId = requestAnimationFrame(refreshIntroOpacity);
      });

      video.addEventListener('pause', () => {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      });

      video.addEventListener('ended', () => {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        showFinalState();
        headerContent.classList.add('interactive');
        // 可调整-动画-时长：热区激活延迟(ms)
        setTimeout(() => hotspotLayer.classList.add('active'), 200);
      });

      if (!video.paused) {
        rafId = requestAnimationFrame(refreshIntroOpacity);
      }

    } else {
      // ── 从子页面返回：跳过动画，直接定位到视频末帧 ──
      video.style.opacity = '0'; // 先隐藏防止闪烁第一帧

      function revealLastFrame() {
        if (isNaN(video.duration)) return;
        video.currentTime = video.duration - 0.001; // 定位到最后一帧
        video.addEventListener('seeked', () => {
          video.style.transition = 'opacity 0.3s ease';
          video.style.opacity    = '1';
        }, { once: true });
      }

      if (video.readyState >= 1) {
        revealLastFrame();
      } else {
        video.addEventListener('loadedmetadata', revealLastFrame, { once: true });
      }

      showFinalState();
      hotspotLayer.classList.add('active');
    }

    // ===== 初始化页面上所有内联 SVG 热区 =====
    document.querySelectorAll('.hotspot-svg').forEach(initSvgHotspot);

  </script>
</body>
</html>
