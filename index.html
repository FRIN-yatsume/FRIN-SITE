<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIN - Fuji Research Institute of Neuroscience</title>
  <style>

    /* ===== Palatino Linotype 字体本地加载 ===== */
    @font-face {
      font-family: 'PalatinoLinotype';
      src: url('asset/palai.ttf') format('truetype');
      font-style: italic;
      font-weight: normal;
    }

    /* ===== 全局重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===================================================
       Logo / 标题 位置调整说明（按需求改下面变量即可）

       【左右 · Logo 与标题一起动】
       --content-inset-left
         → Logo 左缘 与 大标题首字（Fuji 的 F）对齐，改一处两边同步
         → 数值变大 = 一起往右；变小 = 一起往左
         → 例：3% | 4vw | clamp(16px, 3vw, 56px)

       【左右 · 只挪 Logo、标题不动】
       --logo-offset-x
         → 在已对齐基础上再微调 Logo，例：8px、-0.5vw

       【上下 · 只挪 Logo（黑条内）、标题不动】
       --logo-offset-y
         → 正值向下、负值向上，例：4px、-0.3vh
       #header-content 的 align-items
         → 改 center / flex-start / flex-end 可整体改变 Logo 在黑条里的垂直对齐

       【大小 · Logo 缩放】
       .frin-logo 的 height: clamp(最小, 首选, 最大)
         → 中间项 14vh 随窗口变；顶栏高度见 #header-bar 的 height: 20vh

       【上下 · 大标题整块（不是 Logo）】
       .title-overlay 的 justify-content
         → center=竖直居中 flex-start=靠上（与 Logo 无联动）
    =================================================== */
    /* ===================================================
       顶栏导航 位置调整说明（右对齐，链接向左延展）

       【右对齐点 · 最右链接距屏幕右缘】
       --nav-align-right
         → 变大 = 整组导航往左移；变小 = 更贴右（右侧呼吸变小）
         → 例：3% | 48px | 3vw

       【链接间距 · 相邻两个导航词之间的空隙】
       --nav-link-gap
         → 变大 = 更松散；变小 = 更紧凑
         → 例：4.5vw | clamp(32px, 5vw, 96px)

       【字间距 · 每个链接内部的字母间距】
       --nav-letter-spacing
         → 见 nav a，与 --nav-link-gap 无关

       【向左延展上限 · 导航区域左边界】
       --nav-max-left
         → 默认 50%：导航不伸入左半屏（避免压标题）
         → 改为 0 或去掉 nav 的 left 属性 = 可一直向左延

       【上下 · 只挪导航、Logo 不动】
       --nav-offset-y
         → 正值向下、负值向上
    =================================================== */
    :root {
      --content-inset-left: 3%;
      --logo-offset-x: -35px;
      --logo-offset-y: 0;
      --nav-align-right: 8%;
      --nav-link-gap: 15vw;
      --nav-letter-spacing: 0.04em;
      --nav-offset-y: 18px;
      --nav-max-left: 20%;
    }

    /* ===== body：页面背景渐变，锁死视口，禁止滚动 ===== */
    body {
      background: linear-gradient(to bottom, #585858, #c64aef); /* ：页面背景渐变色，上→下 */
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===================================================
       顶部 header：分两层
       - #header-bar    ：黑色条背景，BAR_KEYFRAMES 控制进场
       - #header-content：logo + 导航文字，TITLE_KEYFRAMES 控制进场
    =================================================== */
    #header-bar {
      position: relative;
      width: 100%;
      height: 19vh;         /* 可调整：顶部黑条高度 */
      background: #000000;  /* 可调整：顶部黑条背景颜色 */
      flex-shrink: 0;
      opacity: 0;           /* 进场动画初始值，不要改这里 */
      z-index: 100;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1); /* 这里设置黑条淡入过渡，贝塞尔曲线使透明度变化更平滑 */
    }

    /* 内容层：Logo + 导航；align-items 控制 Logo 在黑条内的上下对齐 */
    #header-content {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;  /* 可调整：Logo 垂直 — center | flex-start | flex-end */
      padding: 0 0 0 var(--content-inset-left); /* 左=标题起点；右侧留白由 --nav-align-right 控制 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 进场结束后开启点击 */
    #header-content.interactive {
      pointer-events: all;
    }

    /* FRIN Logo：水平对齐见 --content-inset-left；仅 Logo 微调见 --logo-offset-* */
    .frin-logo {
      height: clamp(22px, 14vh, 130px); /* 可调整：Logo 大小（最小, 随视口, 最大） */
      width: auto;
      flex-shrink: 0;
      display: block;
      margin-left: var(--logo-offset-x);  /* 可调整：只挪 Logo 左右，不改标题 */
      margin-top: var(--logo-offset-y);   /* 可调整：只挪 Logo 上下，不改标题 */
    }

    /* 顶部导航：从右对齐点向左排布，见 :root 中 --nav-* 变量 */
    nav {
      position: absolute;
      top: 0;
      right: var(--nav-align-right);  /* 可调整：右对齐点，见 :root */
      left: var(--nav-max-left);      /* 可调整：向左延展上限，见 :root */
      height: 100%;
      display: flex;
      flex-direction: row;
      justify-content: flex-end;        /* 整组贴右，contact us 在最右 */
      align-items: center;
      gap: var(--nav-link-gap);       /* 可调整：链接间距，见 :root */
      margin-top: var(--nav-offset-y);  /* 可调整：只挪导航上下，见 :root */
    }

    nav a {
      font-family: 'Times New Roman', serif; /* 可调整：导航字体 */
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px);  /* 可调整：导航文字大小（最小值, 视口比例, 最大值） */
      color: #5a585b;                        /* 可调整：导航文字默认颜色 */
      text-decoration: none;
      letter-spacing: var(--nav-letter-spacing); /* 可调整：字间距，见 :root */
      transition: color 0.3s;
      white-space: nowrap;
    }

    nav a:hover  { color: #c8c8c8; }   /* 可调整：导航文字 hover 颜色 */
    nav a.active { color: #ff31eb; }   /* 可调整：当前页导航高亮颜色 */

    /* ===== 场景容器：剩余视口高度，居中放置内容 ===== */
    .scene-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      overflow: hidden;
    }

    /* ===== 主场景：全屏固定定位 ===== */
    .scene {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;  /* 可调整：场景尺寸，默认全屏 */
      overflow: hidden;
      z-index: 0;
    }

    /* 进场视频铺满场景 */
    .scene video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;    /* 可调整：视频填充模式，cover=裁剪填满，contain=留黑边 */
      display: block;
    }

    /* ===== 左侧大标题覆盖层 ===== */
    .title-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 48%;           /* 可调整：标题覆盖层宽度（占场景宽度的比例） */
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center; /* 可调整：标题垂直对齐方式 flex-start=顶部 center=居中 */
      padding-left: var(--content-inset-left); /* 与 Logo 左对齐，改 :root 里同一变量 */
      opacity: 0;
      pointer-events: none;
      z-index: 105; /* 须为 body 同级层叠，高于 #header-bar(100) */
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 标题每一行（Fuji / Research / Institute / Neuroscience） */
    .title-line {
      font-family: 'Verdana', sans-serif; /* 可调整：标题主字体 */
      font-weight: bold;
      font-style: italic;
      font-size: clamp(16px, 5.8vw, 112px); /* 可调整：标题文字大小（最小值, 视口比例, 最大值） */
      color: #ffffff;                        /* 可调整：标题文字颜色（首字母以外） */
      line-height: 1.18;                     /* 可调整：标题行间距 */
      display: block;
    }

    /* 每行开头大写字母（F / R / I / N） */
    .title-line .initial {
      color: #ff31eb; /* 可调整：标题首字母高亮颜色 */
    }

    /* 标题中的 "of" 行，使用衬线字体 */
    .title-of {
      font-family: 'PalatinoLinotype', 'Palatino Linotype', Palatino, serif; /* 可调整：of 字体 */
      font-weight: normal;
      font-style: italic;
      font-size: clamp(13px, 4.5vw, 86px); /* 可调整：of 文字大小（最小值, 视口比例, 最大值） */
      color: #ffffff;                       /* 可调整：of 文字颜色 */
      line-height: 1.18;                    /* 可调整：of 行间距 */
      display: block;
    }

    /* ===== 热区层：视频结束后 fade in 激活 ===== */
    .hotspot-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease; /* 可调整：热区层淡入过渡时长 */
      z-index: 20;
    }

    .hotspot-layer.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===================================================
       内联 SVG 热区：铺满场景，与视频完全对齐
       ⚠️ 校准模式：fill 和 stroke 已设为可见（红色半透明）
          校准完成后将 fill / stroke 改回 transparent / none
    =================================================== */
    .hotspot-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
      pointer-events: none; /* SVG 容器本身不接收事件，由 shape 单独开启 */
    }

    /* 热区形状（path / polyline） */
    .hotspot-svg .hotspot-shape {
      /* ========== 热区可见性：下方两行控制热区显示/隐藏 ==========
         - 当前为隐藏状态（正式状态）
         - 需要调试时，注释掉下面两行，解除注释来激活可见样式（第194-196行）
         ============================================================ */
      fill: transparent;   /* 热区可见性：完全透明，不遮挡视频 */
      stroke: none;        /* 热区可见性：无描边 */

      /* 热区可见性：调试模式的临时可见样式（当上面两行被注释时生效）
      fill: rgba(255, 0, 0, 0.3);      热区可见性：校准时热区填充颜色和透明度
      stroke: #ff0000;                 热区可见性：校准时热区描边颜色
      stroke-width: 2;                 热区可见性：校准时热区描边宽度（SVG 单位，相对于 1920 画布）
      */

      pointer-events: all; /* 透明区域也可接收点击，保持开启 */
      cursor: pointer;
    }

    /* ===== 光点辉光 ===== */
    .glow-point {
      position: fixed;
      width: 20px;          /* 可调整：光点直径（像素） */
      height: 20px;         /* 保持圆形 */
      border-radius: 50%;
      transform: translate(-50%, -50%); /* 以光点中心为定位锚点，不要改 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;   /* 可调整：光点出现/消失过渡时长 */
      z-index: 30;
    }

    .glow-point.visible {
      opacity: 1;
    }

    /* ===== Tooltip（脑区提示框） ===== */
    .tooltip {
      position: fixed;
      background: rgba(14, 0, 22, 0.9);          /* 可调整：提示框背景色和透明度 */
      border: 1px solid rgba(198, 74, 239, 0.55); /* 可调整：提示框边框颜色和透明度 */
      padding: 1% 1.4%;                           /* 可调整：提示框内边距（上下, 左右） */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
      white-space: nowrap;
    }

    .tooltip.visible { opacity: 1; }

    /* 提示框第一行：脑区英文名（小字） */
    .tooltip .region-name {
      font-family: 'Times New Roman', serif;     /* 可调整：脑区名字体 */
      font-size: clamp(7px, 0.65vw, 12px);       /* 可调整：脑区名文字大小 */
      color: #5a585b;                            /* 可调整：脑区名文字颜色 */
      text-transform: uppercase;
      letter-spacing: 0.12em;                    /* 可调整：脑区名字间距 */
      display: block;
      margin-bottom: 0.3em;                      /* 可调整：脑区名与功能词的间距 */
    }

    /* 提示框第二行：功能关键词（大字，品牌色） */
    .tooltip .region-function {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(11px, 1.05vw, 19px);      /* 可调整：功能关键词文字大小 */
      color: #ff31eb;                            /* 可调整：功能关键词颜色 */
      display: block;
      margin-bottom: 0.5em;                      /* 可调整：功能词与链接的间距 */
    }

    /* 提示框第三行：跳转链接 */
    .tooltip .region-link {
      font-family: 'Times New Roman', serif;
      font-size: clamp(9px, 0.8vw, 14px);        /* 可调整：链接文字大小 */
      color: #ffffff;                            /* 可调整：链接默认颜色 */
      text-decoration: none;
      pointer-events: all;
      transition: color 0.25s;
    }

    .tooltip .region-link:hover {
      color: #edc969; /* 可调整：链接 hover 颜色 */
    }

    /* ===== 底部纯黑条 ===== */
    #footer {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      background: #000000;    /* 可调整：底部黑条背景颜色 */
      padding: 0 3vw;         /* 可调整：底部黑条左右内边距 */
      height: 12vh;           /* 可调整：底部黑条高度 */
      display: flex;
      justify-content: flex-end; /* 可调整：底部内容水平对齐，flex-end=靠右 flex-start=靠左 center=居中 */
      align-items: center;
      flex-shrink: 0;
      opacity: 0;
      z-index: 100;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #footer a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px); /* 可调整：底部链接文字大小 */
      color: #ff31eb;                      /* 可调整：底部链接默认颜色 */
      text-decoration: none;
      letter-spacing: 0.04em;             /* 可调整：底部链接字间距 */
      transition: color 0.3s;
    }

    #footer a:hover {
      color: #ffffff; /* 可调整：底部链接 hover 颜色 */
    }

  </style>
</head>
<body>

  <!-- ===== 顶部黑条 ===== -->
  <div id="header-bar">
    <div id="header-content">
      <img class="frin-logo" src="asset/frinLogo.png" alt="FRIN Logo">
      <nav>
        <a href="index.html" class="active">homepage</a>
        <a href="recruit.html">recruit</a>
        <a href="now.html">now</a>
        <a href="contact.html">contact us</a>
      </nav>
    </div>
  </div>

  <!-- 大标题覆盖层（body 同级，才能压过 #header-bar） -->
  <div class="title-overlay" id="title-overlay">
    <span class="title-line"><span class="initial">F</span>uji</span>
    <span class="title-line"><span class="initial">R</span>esearch</span>
    <span class="title-line"><span class="initial">I</span>nstitute</span>
    <span class="title-of">of</span>
    <span class="title-line"><span class="initial">N</span>euroscience</span>
  </div>

  <!-- ===== 场景容器 ===== -->
  <div class="scene-container" id="scene-container">
    <div class="scene" id="scene">

      <!-- 进场动画视频 -->
      <video id="intro-video" muted playsinline preload="auto">
        <source src="asset/MainLoadingBottom.mp4" type="video/mp4">
      </video>

      <!-- =====================================================
           热区层：视频结束后激活
           热区可见性：三个内联 SVG 与视频画面完全对齐（同一 1920×1080 坐标系）
           热区可见性：当前为隐藏状态，调试时修改 CSS 中 .hotspot-shape 的 fill/stroke
      ====================================================== -->
      <div class="hotspot-layer" id="hotspot-layer">

        <!-- 热区可见性：Reward 热区（Nucleus Accumbens，跳转 reward.html） -->
        <svg class="hotspot-svg"
             id="obj-reward"
             viewBox="0 0 1920 1080"
             preserveAspectRatio="none"
             xmlns="http://www.w3.org/2000/svg"
             data-glow="glow-reward"
             data-tooltip="tooltip-reward"
             data-target="reward.html">
          <path class="hotspot-shape"
                d="M894.28,625.94c10.72,0,110.3,35.23,110.3,35.23l38.3,7.66,6.13-42.89,1.53-70.47-156.26,7.66s-13.79,50.55-9.19,49.02,9.19,13.79,9.19,13.79Z"/>
        </svg>

        <!-- Reward 光点辉光（黄色） -->
        <div class="glow-point" id="glow-reward"
             style="background: #edc969;">
        </div>

        <!-- Reward Tooltip（提示框位置与光点对应） -->
        <div class="tooltip" id="tooltip-reward">
          <span class="region-name">Nucleus Accumbens</span>
          <span class="region-function">Reward</span>
          <a class="region-link" href="reward.html">Awards &amp; Recognition →</a>
        </div>


        <!-- 热区可见性：Vision 热区（Visual Cortex，两段 path 合并为一个区域，跳转 vision.html） -->
        <svg class="hotspot-svg"
             id="obj-vision"
             viewBox="0 0 1920 1080"
             preserveAspectRatio="none"
             xmlns="http://www.w3.org/2000/svg"
             data-glow="glow-vision"
             data-tooltip="tooltip-vision"
             data-target="vision.html">
          <path class="hotspot-shape"
                d="M1211.38,613.37c2.31,27.48,83.22,125.62,83.22,125.62l43.92-62.81-110.97-62.81"/>
          <path class="hotspot-shape"
                d="M1443.98,214.52l-125.31,31.8,228.2,154.42s87.32,194.24,44.43,275.43c-5.45,10.32-157.79,135.12-157.79,135.12l137.87,27.57,78.13-52.09,100.45-98.16-7.92-167.4-41.36-101.11-80.28-103.64-70.47-62.81-105.95-39.16Z"/>
        </svg>

        <!-- Vision 光点辉光（黄色） -->
        <div class="glow-point" id="glow-vision"
             style="background: #edc969;">
        </div>

        <!-- Vision Tooltip -->
        <div class="tooltip" id="tooltip-vision">
          <span class="region-name">Visual Cortex</span>
          <span class="region-function">Vision</span>
          <a class="region-link" href="vision.html">Visual Research →</a>
        </div>


        <!-- 热区可见性：Secret 热区（隐藏彩蛋：无 tooltip，仅红色光点，跳转 secret.html） -->
        <svg class="hotspot-svg"
             id="obj-secret"
             viewBox="0 0 1920 1080"
             preserveAspectRatio="none"
             xmlns="http://www.w3.org/2000/svg"
             data-glow="glow-secret"
             data-target="secret.html">
          <polyline class="hotspot-shape"
                    points="1153.17 431.38 1050.53 422.19 1024.49 475.81 1073.51 520.23 1108.74 520.23 1153.17 439.04"/>
        </svg>

        <!-- Secret 光点辉光（红色） -->
        <div class="glow-point" id="glow-secret"
             style="background: #b2002a;">
        </div>

      </div><!-- /hotspot-layer -->
    </div><!-- /scene -->
  </div><!-- /scene-container -->

  <!-- ===== 底部纯黑条 ===== -->
  <footer id="footer">
    <a href="questionnaire.html">questionnaire→</a>
  </footer>


  <script>

    // ===== 进场动画关键帧：顶部黑条 + 底部黑条同步进场 =====
    const BAR_KEYFRAMES = [
      { time: 0.800, opacity: 0.10 },
      { time: 0.900, opacity: 0.20 },
      { time: 1.000, opacity: 0.40 },
      { time: 1.100, opacity: 0.80 },
      { time: 1.200, opacity: 1.00 },
    ];

    // ===== 进场动画关键帧：标题 + 导航 + Logo 同步进场 =====
    const TITLE_KEYFRAMES = [
      { time: 1.625, opacity: 0.00 },
      { time: 1.750, opacity: 0.10 },
      { time: 1.875, opacity: 0.60 },
      { time: 2.000, opacity: 0.80 },
      { time: 2.125, opacity: 1.00 },
    ];

    // ===== smooth-step 补间函数（模拟动画软件缓动） =====
    function smoothstep(a, b, t) {
      t = Math.max(0, Math.min(1, t));
      t = t * t * (3 - 2 * t);
      return a + (b - a) * t;
    }

    // ===== 根据当前视频时间插值出 opacity =====
    function getOpacity(keyframes, currentTime) {
      if (currentTime < keyframes[0].time) return 0;
      if (currentTime >= keyframes[keyframes.length - 1].time) return 1;
      for (let i = 0; i < keyframes.length - 1; i++) {
        const a = keyframes[i], b = keyframes[i + 1];
        if (currentTime >= a.time && currentTime <= b.time) {
          const t = (currentTime - a.time) / (b.time - a.time);
          return smoothstep(a.opacity, b.opacity, t);
        }
      }
      return 0;
    }

    // ===== DOM 元素引用 =====
    const video         = document.getElementById('intro-video');
    const headerBar     = document.getElementById('header-bar');
    const headerContent = document.getElementById('header-content');
    const titleOverlay  = document.getElementById('title-overlay');
    const footer        = document.getElementById('footer');
    const hotspotLayer  = document.getElementById('hotspot-layer');
    const scene         = document.getElementById('scene');

    // ===== 场景尺寸：保持全视口 =====
    function resizeScene() {
      scene.style.width  = window.innerWidth  + 'px';
      scene.style.height = window.innerHeight + 'px';
    }
    resizeScene();
    window.addEventListener('resize', resizeScene);

    // ===== 所有 UI 元素跳到最终显示态（跳过动画时调用） =====
    function showFinalState() {
      headerBar.style.opacity     = 1;
      headerContent.style.opacity = 1;
      headerContent.classList.add('interactive');
      titleOverlay.style.opacity  = 1;
      footer.style.opacity        = 1;
    }

    // =====================================================
    // 初始化内联 SVG 热区
    // 直接在页面 DOM 里查找 shape，不需要 contentDocument
    // =====================================================
    function initSvgHotspot(svgEl) {
      // 读取关联的光点和 tooltip 元素（通过 data-* 属性）
      const glowEl    = svgEl.dataset.glow
                        ? document.getElementById(svgEl.dataset.glow)
                        : null;
      const tooltipEl = svgEl.dataset.tooltip
                        ? document.getElementById(svgEl.dataset.tooltip)
                        : null;
      const target    = svgEl.dataset.target;

      // 查找该 SVG 内所有热区形状
      const shapes = svgEl.querySelectorAll('.hotspot-shape');

      // hover 进入：显示光点 + tooltip
      function showHover(e) {
        if (glowEl)    glowEl.classList.add('visible');
        if (tooltipEl) tooltipEl.classList.add('visible');
        updateHoverPosition(e);
      }

      // hover 离开：隐藏光点 + tooltip
      function hideHover() {
        if (glowEl)    glowEl.classList.remove('visible');
        if (tooltipEl) tooltipEl.classList.remove('visible');
      }

      // 更新光点和提示框位置到鼠标处
      function updateHoverPosition(e) {
        const x = e.clientX;
        const y = e.clientY;
        if (glowEl) {
          glowEl.style.left = x + 'px';
          glowEl.style.top = y + 'px';
        }
        if (tooltipEl) {
          tooltipEl.style.left = (x + 20) + 'px';
          tooltipEl.style.top = y + 'px';
        }
      }

      // 为每个 shape 绑定交互事件
      shapes.forEach(shape => {
        shape.addEventListener('mouseenter', showHover);
        shape.addEventListener('mouseleave', hideHover);
        shape.addEventListener('mousemove', updateHoverPosition);
        shape.addEventListener('click', () => {
          window.location.href = target;
        });
      });
    }

    // ===== 首次访问 vs 刷新 vs 从子页面返回 判断 =====
    const navEntry   = performance.getEntriesByType('navigation')[0];
    const isReload   = navEntry && navEntry.type === 'reload';
    const hasVisited = sessionStorage.getItem('frin_intro_played');
    const playIntro  = isReload || !hasVisited;

    sessionStorage.setItem('frin_intro_played', '1');

    if (playIntro) {
      // ── 首次访问 / 刷新：播放进场动画 ──
      video.play();

      let rafId = null;
      function refreshIntroOpacity() {
        const t = video.currentTime;
        // 顶部 + 底部黑条同步淡入
        const barOp             = getOpacity(BAR_KEYFRAMES, t);
        headerBar.style.opacity = barOp;
        footer.style.opacity    = barOp;
        // 标题 + 导航同步淡入
        const titleOp               = getOpacity(TITLE_KEYFRAMES, t);
        titleOverlay.style.opacity  = titleOp;
        headerContent.style.opacity = titleOp;

        if (!video.paused && !video.ended) {
          rafId = requestAnimationFrame(refreshIntroOpacity);
        } else {
          rafId = null;
        }
      }

      video.addEventListener('play', () => {
        if (rafId === null) rafId = requestAnimationFrame(refreshIntroOpacity);
      });

      video.addEventListener('pause', () => {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      });

      video.addEventListener('ended', () => {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        showFinalState();
        headerContent.classList.add('interactive');
        // 视频结束后 0.2s 激活热区层（可调整：热区激活延迟时间，单位毫秒）
        setTimeout(() => hotspotLayer.classList.add('active'), 200);
      });

      if (!video.paused) {
        rafId = requestAnimationFrame(refreshIntroOpacity);
      }

    } else {
      // ── 从子页面返回：跳过动画，直接定位到视频末帧 ──
      video.style.opacity = '0'; // 先隐藏防止闪烁第一帧

      function revealLastFrame() {
        if (isNaN(video.duration)) return;
        video.currentTime = video.duration - 0.001; // 定位到最后一帧
        video.addEventListener('seeked', () => {
          video.style.transition = 'opacity 0.3s ease';
          video.style.opacity    = '1';
        }, { once: true });
      }

      if (video.readyState >= 1) {
        revealLastFrame();
      } else {
        video.addEventListener('loadedmetadata', revealLastFrame, { once: true });
      }

      showFinalState();
      hotspotLayer.classList.add('active');
    }

    // ===== 初始化页面上所有内联 SVG 热区 =====
    document.querySelectorAll('.hotspot-svg').forEach(initSvgHotspot);

  </script>
</body>
</html>
