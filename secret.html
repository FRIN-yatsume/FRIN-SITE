<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIN - ???</title>
  <style>

    /* ===== 全局重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== body：渐变背景，允许滚动（子页面不锁定视口） ===== */
    body {
      background: linear-gradient(to bottom, #585858, #c64aef);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 导航栏：横跨全宽 ===== */
    header {
      width: 100%;
      background: linear-gradient(to bottom, #1a1a1a, #2a2a2a);
      display: flex;
      align-items: center;
      padding: 0 2.5vw;
      height: 8.15vh;
      flex-shrink: 0;
    }

    .frin-logo { height: 70%; width: auto; margin-right: 3vw; }

    nav { display: flex; gap: 4.5vw; }

    nav a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px);
      color: #5a585b;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    nav a:hover  { color: #c8c8c8; }
    nav a.active { color: #ff31eb; }

    /* ===== 维护提示居中区域 ===== */
    .maintenance {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5vh 0;
    }

    .maintenance p {
      font-family: 'Times New Roman', serif;
      font-size: clamp(12px, 1.2vw, 22px);
      color: #5a585b;
      letter-spacing: 0.05em;
    }

    /* ===== 底部条块：横跨全宽，纯黑 ===== */
    footer {
      width: 100%;
      background: #000000;
      padding: 0 3vw;
      height: 5.56vh;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-shrink: 0;
    }

    footer a {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: clamp(10px, 1.2vw, 22px);
      color: #ff31eb;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    footer a:hover { color: #ffffff; }

  </style>
</head>
<body>

  <!-- ===== 导航栏 ===== -->
  <header>
    <img class="frin-logo" src="asset/frinLogo.png" alt="FRIN Logo">
    <nav>
        <a href="index.html" class="active">homepage</a>
        <a href="recruit.html">recruit</a>
        <a href="now.html">now</a>
        <a href="contact.html">contact us</a>
    </nav>
  </header>

  <!-- ===== 维护占位内容 ===== -->
  <div class="maintenance">
    <p>Sorry, this page is currently under maintenance.</p>
  </div>

  <!-- ===== 底部条块 ===== -->
  <footer>
    <a href="questionnaire.html">questionnaire→</a>
  </footer>

</body>
</html>
